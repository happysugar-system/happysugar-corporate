an><input name="name" required maxlength="100" autocomplete="name"></label><label>メールアドレス<span>必須</span><input type="email" name="email" required maxlength="254" autocomplete="email"></label><label>電話番号<input type="tel" name="phone" maxlength="40" autocomplete="tel"></label><label>お問い合わせ内容<span>必須</span><textarea name="message" required maxlength="3000" rows="7"></textarea></label><small>パスワードやクレジットカード情報などは入力しないでください。</small><div class="trap" aria-hidden="true"><label>空欄のままにしてください<input name="trap" tabindex="-1" autocomplete="off"></label></div><input type="hidden" name="token" id="token"><label class="consent"><input type="checkbox" name="consent" value="yes" required> <a href="privacy.html" target="_blank" rel="noopener">個人情報の取り扱い</a>に同意する</label><button class="button" type="submit">入力内容を確認する →</button></form><section id="confirm" hidden><h2>入力内容の確認</h2><div id="review" class="confirm-text"></div><div class="actions"><button class="button" id="send" type="button">送信する</button><button class="button light" id="back" type="button">修正する</button></div></section><p id="status" role="status" aria-live="polite"></p><noscript><p>フォームをご利用いただくにはJavaScriptを有効にしてください。メールでもお問い合わせいただけます。</p></noscript></article><aside class="contact-card contact-side"><img src="assets/hero.webp" alt="明るいワークスペースのイメージ"><h3>お問い合わせ窓口</h3><p>メールでのお問い合わせ：<br><a href="mailto:info@happysugar.online">info@happysugar.online</a></p><h3>業務システム開発のご相談</h3><p>専用の相談フォームもご利用いただけます。</p><a class="button" href="https://consult.happysugar.online/">システム開発の相談へ →</a></aside></div></div></section></main><footer class="foot"><div class="wrap"><strong>合同会社Happysugar</strong><a href="privacy.html">プライバシーポリシー</a></div></footer><script>const f=document.getElementById('contactForm'),c=document.getElementById('confirm'),s=document.getElementById('status'),send=document.getElementById('send'),back=document.getElementById('back');let submitted=false;document.getElementById('token').value=crypto.randomUUID();f.addEventListener('submit',e=>{e.preventDefault();if(!f.reportValidity())return;const d=new FormData(f);document.getElementById('review').textContent=[['種別','type'],['会社名','company'],['お名前','name'],['メール','email'],['電話','phone'],['内容','message']].map(([l,k])=>l+'：'+d.get(k)).join('\n');f.hidden=true;c.hidden=false;document.getElementById('review').scrollIntoView({block:'center'});});back.onclick=()=>{c.hidden=true;f.hidden=false;};send.onclick=()=>{if(submitted)return;submitted=true;send.disabled=true;back.disabled=true;s.textContent='送信中です。受付結果が表示されるまで画面を閉じないでください。';HTMLFormElement.prototype.submit.call(f);};window.addEventListener('pageshow',()=>{submitted=false;send.disabled=false;back.disabled=false;s.textContent='';});</script></body></html>
