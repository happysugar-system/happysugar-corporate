<!doctype html><html lang="ja"><head><base target="_top"><meta charset="utf-8"><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#fff4f2;color:#20432c;margin:0;line-height:1.8}main{max-width:740px;margin:35px auto;padding:28px;background:#fffdfb;border-radius:14px}img{width:210px;max-width:100%}h1{font-size:28px}label{display:block;font-weight:600;margin:16px 0 5px}input:not([type=checkbox]),textarea,select{width:100%;padding:12px;border:1px solid #d9c9c4;border-radius:6px;font:inherit;color:#20432c;background:white}button{background:#20432c;color:white;border:0;padding:14px 24px;border-radius:6px;font:inherit;cursor:pointer;margin:14px 0}button:disabled{opacity:.5}a{color:#20432c}small{color:#57645b}.trap{position:absolute;left:-10000px}#review{white-space:pre-wrap;overflow-wrap:anywhere;background:#f9efed;padding:18px;border-radius:6px}#status{white-space:pre-wrap} @media(max-width:600px){main{margin:12px;padding:20px}}</style></head><body><main><a href="https://happysugar.online/"><img src="https://happysugar.online/assets/logo-horizontal.webp" alt="Happysugar"></a><h1>お問い合わせ</h1><p>商品・お取引・業務システム開発など、お気軽にご相談ください。</p><form id="f"><label for="type">お問い合わせ種別（必須）</label><select id="type" name="type" required><option value="">選択してください</option><option>商品について</option><option>お取引について</option><option>業務システム開発について</option><option>業務提携について</option><option>その他</option></select><label for="company">会社名・屋号</label><input id="company" name="company" maxlength="150" autocomplete="organization"><label for="name">お名前（必須）</label><input id="name" name="name" required maxlength="100" autocomplete="name"><label for="email">メールアドレス（必須）</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"><label for="phone">電話番号（任意）</label><input id="phone" name="phone" type="tel" maxlength="40" autocomplete="tel"><label for="message">お問い合わせ内容（必須）</label><textarea id="message" name="message" rows="7" required maxlength="3000"></textarea><small>パスワードやクレジットカード情報などは入力しないでください。</small><div class="trap" aria-hidden="true"><input name="trap" tabindex="-1" autocomplete="off"></div><label><input name="consent" type="checkbox" required> <a href="https://happysugar.online/privacy.html" target="_blank" rel="noopener">個人情報の取り扱い</a>に同意する</label><button type="submit">入力内容を確認する</button></form><section id="confirm" hidden><h2>入力内容の確認</h2><div id="review"></div><button id="send">送信する</button> <button id="back">修正する</button></section><p id="status" role="status" aria-live="polite"></p><a href="https://happysugar.online/">会社HPへ戻る</a><p><small>メール：info@happysugar.online</small></p></main><script>const f=document.getElementById('f'),confirmBox=document.getElementById('confirm'),statusBox=document.getElementById('status'),send=document.getElementById('send'),back=document.getElementById('back');let data;const token=crypto.randomUUID();f.addEventListener('submit',e=>{e.preventDefault();data=Object.fromEntries(new FormData(f));data.consent=f.elements.consent.checked;data.token=token;document.getElementById('review').textContent=['種別：'+data.type,'会社名：'+data.company,'氏名：'+data.name,'メール：'+data.email,'電話：'+data.phone,'内容：'+data.message].join('\n');f.hidden=true;confirmBox.hidden=false;statusBox.textContent='';});back.onclick=()=>{confirmBox.hidden=true;f.hidden=false;statusBox.textContent='';};send.onclick=()=>{send.disabled=true;back.disabled=true;statusBox.textContent='送信中…';google.script.run.withSuccessHandler(r=>{confirmBox.hidden=true;f.hidden=true;statusBox.textContent='お問い合わせを受け付けました。\n受付ID：'+r.id;}).withFailureHandler(e=>{send.disabled=false;back.disabled=false;statusBox.textContent='受付結果を確認できませんでした。時間をおいて再試行するか、会社メールへお問い合わせください。';}).submitContact(data);};</script></body></html>
